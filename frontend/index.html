<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LexiNLP — A Field Notebook for News</title>
    <meta
      name="description"
      content="A field notebook for news: extractive summarization, vocabulary learning, notes, history, offline text-to-speech, and ROUGE evaluation."
    />

      // Apply the saved theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem('lexica_theme') === 'night') {
          document.documentElement.dataset.theme = 'night';
        }
      } catch (e) {}
    </script>
